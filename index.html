<!doctype html>
<html data-concept="home" data-default-theme="light" data-base="./">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Social Company — Website directions</title>
<link rel="stylesheet" href="shared/base.css">
<script src="shared/content.js"></script>
<script src="shared/core.js"></script>
<style>
body { transition: background-color .5s, color .5s; }
.wrap { max-width: 1400px; margin-inline: auto; padding: 0 var(--gut); }
header { display: flex; justify-content: space-between; align-items: center; padding-block: 20px; }
.logo { font-family: var(--f-head); font-weight: 700; font-size: 19px; letter-spacing: -.03em; }
.logo em { color: var(--orange); font-style: normal; }
h1 { font-size: clamp(44px, 8vw, 132px); margin-top: clamp(36px, 8vh, 90px); max-width: 12ch; }
.intro { color: var(--muted); max-width: 52ch; margin-top: 20px; font-size: 18px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-block: clamp(36px, 7vh, 72px); }
.c { border-radius: 28px; padding: clamp(24px, 3vw, 44px); min-height: 340px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; transition: translate .5s var(--ease), border-radius .5s var(--ease); }
.c:hover { translate: 0 -8px; border-radius: 44px; }
.c b { font-family: var(--f-head); font-size: clamp(90px, 12vw, 200px); letter-spacing: -.06em; line-height: .8; position: absolute; right: 24px; top: 24px; opacity: .22; transition: opacity .4s, rotate .6s var(--ease); }
.c:hover b { opacity: 1; rotate: -8deg; }
.c h2 { font-size: clamp(30px, 3.6vw, 56px); }
.c p { margin-top: 12px; max-width: 40ch; opacity: .8; font-size: 16px; }
.c .mono { opacity: .8; }
.main { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; background: var(--blue); color: #fff; border-radius: 28px; padding: clamp(24px, 3vw, 44px); margin-top: clamp(36px, 7vh, 72px); min-height: 300px; transition: translate .5s var(--ease), border-radius .5s var(--ease), background .4s; }
.main:hover { translate: 0 -8px; border-radius: 44px; background: var(--orange); }
.main h2 { font-size: clamp(40px, 6vw, 96px); margin-top: 10px; }
.main p { max-width: 46ch; opacity: .85; margin-top: 12px; }
.main b { font-family: var(--f-head); font-size: clamp(40px, 5vw, 80px); line-height: 1; }
.sub { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: clamp(40px, 7vh, 72px); }
.grid { margin-top: 18px !important; }
.c1 { background: var(--card); }
.c2 { background: #101010; color: #fff; }
:root[data-theme="dark"] .c2 { background: #fff; color: #101010; }
.c3 { background: var(--ice); color: #101010; }
.c4 { background: var(--blue); color: #fff; }
.c4 b { color: var(--orange); }
.c5 { border: 2px solid var(--fg); }
.c6 { background: var(--orange); color: #fff; }
.c7 { grid-column: 1 / -1; background: #101010; color: #fff; min-height: 260px; }
:root[data-theme="dark"] .c7 { background: var(--blue); }
footer { display: flex; justify-content: space-between; align-items: center; gap: 24px; flex-wrap: wrap; padding-block: 24px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
@media (max-width: 800px) { .grid { grid-template-columns: 1fr; } .c { min-height: 260px; } }
</style>
</head>
<body>
<div class="wrap">
  <header><span class="logo">The Social Company<em>.</em></span><div data-controls></div></header>
  <h1 id="h"></h1>
  <p class="intro" id="intro"></p>
  <a class="main" href="site/index.html" id="main"></a>
  <p class="sub" id="sub"></p>
  <div class="grid" id="grid"></div>
  <footer><span data-i18n="footer.rights"></span><span data-banners></span></footer>
</div>
<script>
TSC.apply();
const el = TSC.lang === 'el';
document.getElementById('h').textContent = el ? 'Η ιστοσελίδα.' : 'The website.';
document.getElementById('main').innerHTML = `<div><span class="mono">${el ? 'Συνδυασμένη εκδοχή' : 'Combined version'}</span><h2>The Social Company</h2><p>${el ? 'Τα αγαπημένα σου στοιχεία από τις τέσσερις εκδοχές, σε μία ιστοσελίδα.' : 'Your favourite parts of the four concepts, in one website.'}</p></div><b>→</b>`;
document.getElementById('sub').textContent = el ? 'Οι επιμέρους εκδοχές' : 'The individual concepts';
document.getElementById('intro').textContent = el
  ? 'Κάθε σελίδα έχει εναλλαγή φωτεινού / σκούρου θέματος και γλώσσας.'
  : 'Every page has a light / dark switch and an EN / ΕΛ switch.';
const items = [
  ['concept-1-editorial', el ? 'Περιοδικό' : 'Editorial', el ? 'Τεράστια τυπογραφία, χρώματα που αλλάζουν στην κύλιση, οριζόντια γκαλερί υπηρεσιών.' : 'Huge type, background colours that change as you scroll, a horizontal services gallery.'],
  ['concept-2-studio', el ? 'Στούντιο' : 'Studio', el ? 'Σκούρο θέμα, κάρτες που φωτίζονται και γέρνουν με τον κέρσορα, ζωντανά νούμερα.' : 'Dark-first. Cards that light up and tilt under the cursor, animated numbers.'],
  ['concept-3-titles', el ? 'Τίτλοι Έναρξης' : 'Opening Titles', el ? 'Κίνηση λογοτύπου πριν φορτώσει η σελίδα, κάρτες που στοιβάζονται, καθαρό και μοντέρνο.' : 'Logo animation before the page loads, stacking cards, clean and modern.'],
  ['concept-4-playground', el ? 'Παιδότοπος' : 'Playground', el ? 'Η τρελή εκδοχή: πέτα τις υπηρεσίες, πέτα μέσα από ένα τούνελ, βρες την επικοινωνία με φακό.' : 'The wild one: throw the services around, fly through a tunnel, find the contact details with a flashlight.'],
  ['concept-5-reply', el ? 'Η Απάντηση' : 'The Reply', el ? 'Η ελεύθερη εκδοχή μου: ο επισκέπτης απαντά στο «Γεια.» με μία πρόταση, και η σελίδα του προτείνει υπηρεσίες, πακέτο και έτοιμο μήνυμα.' : 'My own take: the visitor answers "Hello." in one sentence, and the page turns it into suggested services, a package and a ready-to-send email.'],
  ['concept-6-os', 'SocialOS', el ? 'Η πιο τρελή: η εταιρεία ως μικρός υπολογιστής. Παράθυρα που σέρνεις, παιχνίδι, δημιουργός αναρτήσεων, τερματικό, και η παρουσίασή σου μέσα.' : 'The bonkers one: the agency as a little computer. Draggable windows, a game, a post maker, a terminal, and your deck inside.'],
  ['concept-7-set', el ? 'Στο Πλατό' : 'On Set', el ? 'Φώτα, Κάμερα, Πάμε: γράμματα με βάρος που πετάς, προβολέας, δαχτυλίδι υπηρεσιών που γυρίζεις, φωτογραφίες πελατών στο τραπέζι, κλακέτα.' : 'Lights, Camera, Action: letters with weight you can throw, a spotlight, a services ring you spin, client photos on a table, a clapperboard.']
];
document.getElementById('grid').innerHTML = items.map((x, i) => `<a class="c c${i + 1}" href="${x[0]}/index.html"><b>${i + 1}</b><span class="mono">${T.ui.concept} 0${i + 1}</span><div><h2>${x[1]}</h2><p>${x[2]}</p></div></a>`).join('');
</script>
</body>
</html>

<!doctype html>
<html data-concept="c1" data-default-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Social Company — Concept 1: Editorial</title>
<link rel="stylesheet" href="../shared/base.css">
<script src="../shared/content.js"></script>
<script src="../shared/core.js"></script>
<style>
/* Tones: each section declares one, the page background follows as you scroll */
body { transition: background-color .9s var(--ease), color .9s var(--ease); }
body[data-tone="blue"] { --bg: var(--blue); --fg: #fff; --muted: rgba(255,255,255,.78); --line: rgba(255,255,255,.3); --card: rgba(255,255,255,.12); }
:root[data-theme="light"] body[data-tone="soft"] { --bg: var(--grey); --card: #fff; }
:root[data-theme="dark"]  body[data-tone="soft"] { --bg: #181818; --card: #242424; }
:root[data-theme="light"] body[data-tone="ice"] { --bg: var(--ice); --card: #fff; }
:root[data-theme="dark"]  body[data-tone="ice"] { --bg: #111938; --card: #1A2452; }
:root[data-theme="light"] body[data-tone="invert"] { --bg: #101010; --fg: #fff; --muted: #A6A6A6; --line: rgba(255,255,255,.16); }
:root[data-theme="dark"]  body[data-tone="invert"] { --bg: #fff; --fg: #101010; --muted: #5E5E5E; --line: rgba(16,16,16,.14); }

.wrap { padding-inline: var(--gut); }
section { padding-block: clamp(90px, 14vh, 180px); position: relative; }
.label { display: flex; align-items: center; gap: 10px; color: var(--muted); margin-bottom: clamp(28px, 5vh, 56px); }
.label::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--orange); }
.h-xl { font-size: clamp(44px, 8.2vw, 148px); }
.h-lg { font-size: clamp(36px, 5.4vw, 92px); }

/* Nav */
.nav { position: fixed; inset: 0 0 auto 0; z-index: 50; display: flex; justify-content: space-between; align-items: center; padding: 18px var(--gut); color: var(--fg); transition: color .9s var(--ease), transform .5s var(--ease); }
.nav.hide { transform: translateY(-110%); }
.logo { font-family: var(--f-head); font-weight: 700; font-size: 19px; letter-spacing: -.03em; line-height: 1; }
.logo em { font-style: normal; color: var(--orange); }
.nav-links { display: flex; gap: 28px; font-size: 15px; font-weight: 500; }
.nav-links a { position: relative; }
.nav-links a::after { content: ""; position: absolute; left: 0; right: 0; bottom: -4px; height: 1.5px; background: currentColor; transform: scaleX(0); transform-origin: right; transition: transform .4s var(--ease); }
.nav-links a:hover::after { transform: scaleX(1); transform-origin: left; }
@media (max-width: 900px) { .nav-links { display: none; } }

/* Hero */
.hero { min-height: 100svh; padding-top: 110px; padding-bottom: 0; display: flex; flex-direction: column; justify-content: flex-end; }
.hero h1 { font-size: clamp(110px, 29vw, 520px); line-height: .8; letter-spacing: -.065em; margin-left: -.04em; cursor: default; user-select: none; }
.hero h1 .split-w { overflow: hidden; padding: .2em .03em .12em; margin: -.2em -.03em -.12em; }
/* hover uses translate/rotate, not transform: a CSS transition on transform would fight the GSAP intro */
.hero h1 .split-c { transition: color .3s, translate .5s var(--ease), rotate .5s var(--ease); }
.hero h1 .split-c:hover { color: var(--blue); translate: 0 -5%; rotate: -5deg; }
.hero h1 .split-c:last-child { color: var(--orange); }
.hero-foot { display: flex; justify-content: space-between; align-items: flex-end; gap: 32px; padding-block: clamp(24px, 4vh, 48px); }
.hero-foot p { max-width: 46ch; font-size: clamp(17px, 1.35vw, 21px); }
.hero-foot .mono { color: var(--muted); white-space: nowrap; }
.hero-media { height: 92vh; overflow: hidden; clip-path: inset(0 var(--gut) 0 var(--gut) round 28px); will-change: clip-path; background: var(--blue); color: #fff; display: flex; flex-direction: column; justify-content: center; gap: 1vw; }
.hm-row { display: flex; gap: .35em; white-space: nowrap; width: max-content; font-family: var(--f-head); font-weight: 700; font-size: clamp(64px, 11.5vw, 210px); letter-spacing: -.05em; line-height: 1.02; will-change: transform; }
.hm-row i { color: var(--orange); font-style: normal; }
.hm-row:nth-child(2) { margin-left: -45vw; color: transparent; -webkit-text-stroke: 2px #fff; }
.hm-row:nth-child(3) { margin-left: -20vw; }

/* About */
.about-text { font-family: var(--f-head); font-weight: 500; font-size: clamp(26px, 3.5vw, 60px); line-height: 1.12; letter-spacing: -.03em; margin-top: clamp(28px, 5vh, 56px); max-width: 1300px; }
.pills { display: flex; flex-wrap: wrap; gap: 10px; margin-top: clamp(40px, 7vh, 80px); }
.pill { border: 1.5px solid var(--line); border-radius: 99px; padding: 9px 18px; font-size: 15px; transition: background .3s, color .3s, border-color .3s, transform .4s var(--ease); }
.pill:hover { background: var(--fg); color: var(--bg); border-color: var(--fg); transform: translateY(-3px) rotate(-2deg); }

/* Why */
.why-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; margin-top: clamp(48px, 8vh, 96px); border-top: 1.5px solid var(--fg); }
.why-item { padding: 28px 28px 36px 0; border-right: 1px solid var(--line); padding-left: 28px; transition: background .4s; }
.why-item:first-child { padding-left: 0; }
.why-item:last-child { border-right: 0; }
.why-item .mono { color: var(--blue); display: block; margin-bottom: clamp(40px, 9vh, 110px); }
.why-item h3 { font-size: clamp(22px, 1.9vw, 30px); letter-spacing: -.02em; line-height: 1.1; margin-bottom: 12px; }
.why-item p { color: var(--muted); font-size: 16px; }
.why-lead { max-width: 34ch; font-size: clamp(18px, 1.5vw, 23px); color: var(--muted); margin-top: 28px; }
@media (max-width: 900px) { .why-grid { grid-template-columns: 1fr 1fr; } .why-item { padding-left: 0 !important; border-right: 0; border-bottom: 1px solid var(--line); } .why-item .mono { margin-bottom: 28px; } }

/* Services: pinned horizontal gallery */
.svc { padding-block: 0; overflow: hidden; }
.svc-track { display: flex; gap: clamp(20px, 2.5vw, 44px); align-items: center; height: 100vh; padding-inline: var(--gut); width: max-content; will-change: transform; }
.svc-intro { width: min(78vw, 520px); flex: none; }
.svc-intro p { color: var(--muted); margin-top: 24px; display: flex; align-items: center; gap: 10px; }
.svc-card { width: min(74vw, 440px); flex: none; }
.svc-img { aspect-ratio: 4 / 5; max-height: 56vh; width: 100%; overflow: hidden; border-radius: 20px; position: relative; background: var(--tile); color: var(--tile-fg); display: flex; align-items: flex-end; padding: 6%; }
.svc-img b { font-family: var(--f-head); font-size: clamp(120px, 15vw, 230px); line-height: .78; letter-spacing: -.07em; position: relative; transition: translate .8s var(--ease); }
.svc-card:hover .svc-img b { translate: 0 -8%; }
.svc-shape { position: absolute; top: 9%; right: 9%; width: 46%; aspect-ratio: 1; background: var(--shape); border-radius: var(--rad); transition: rotate 1s var(--ease), border-radius 1s var(--ease), scale 1s var(--ease); }
.svc-card:hover .svc-shape { rotate: 135deg; border-radius: 50%; scale: 1.15; }
.k0 { --tile: var(--blue); --tile-fg: #fff; --shape: var(--orange); --rad: 50%; }
.k1 { --tile: #101010; --tile-fg: #fff; --shape: var(--blue); --rad: 0; }
.k2 { --tile: var(--ice); --tile-fg: #101010; --shape: var(--blue); --rad: 50% 50% 0 0; }
.k3 { --tile: var(--orange); --tile-fg: #fff; --shape: #101010; --rad: 0 50% 50% 0; }
:root[data-theme="dark"] .k1 { --tile: #fff; --tile-fg: #101010; }
.svc-card h3 { font-size: clamp(26px, 2.4vw, 38px); margin-top: 20px; letter-spacing: -.03em; }
.svc-card p { color: var(--muted); margin-top: 10px; font-size: 16px; max-width: 38ch; }
.svc-card .tags { font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--blue); margin-top: 12px; }
:root[data-theme="dark"] .svc-card .tags { color: #8FA4FF; }
.svc-addons { width: min(80vw, 480px); flex: none; }
.svc-addons ul { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
@media (max-width: 899px) {
  .svc { overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
  .svc-track { height: auto; padding-block: 90px; align-items: flex-start; }
  .svc-card, .svc-intro, .svc-addons { scroll-snap-align: center; }
}

/* Stats */
.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(20px, 3vw, 48px); }
.stat .num { font-family: var(--f-head); font-weight: 700; font-size: clamp(56px, 8.6vw, 156px); letter-spacing: -.06em; line-height: .9; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat .num small { font-size: .45em; color: var(--orange); letter-spacing: -.02em; }
.stat p { color: var(--muted); margin-top: 14px; border-top: 1px solid var(--line); padding-top: 14px; font-size: 15px; max-width: 24ch; }
@media (max-width: 900px) { .stats-grid { grid-template-columns: 1fr 1fr; row-gap: 48px; } }

/* Packages */
.pk-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: clamp(48px, 8vh, 90px); }
.pk { background: var(--card); border-radius: 24px; padding: clamp(24px, 2.4vw, 40px); display: flex; flex-direction: column; min-height: 520px; transition: background .5s var(--ease), color .5s var(--ease), translate .5s var(--ease); }
.pk:hover { background: var(--blue); color: #fff; translate: 0 -10px; }
.pk .mono { color: var(--orange); }
.pk h3 { font-size: clamp(32px, 3vw, 48px); margin-top: 14px; }
.pk .who { margin-top: 14px; opacity: .75; font-size: 16px; min-height: 3.2em; }
.pk ul { margin-top: 28px; border-top: 1px solid var(--line); }
.pk:hover ul, .pk:hover li { border-color: rgba(255,255,255,.3); }
.pk li { padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.pk .price { margin-top: auto; padding-top: 32px; display: flex; align-items: baseline; gap: 8px; }
.pk .price b { font-family: var(--f-head); font-size: clamp(48px, 4.6vw, 76px); letter-spacing: -.05em; line-height: 1; }
.pk .price span { font-family: var(--f-mono); font-size: 12px; opacity: .7; text-transform: uppercase; }
.pk-note { color: var(--muted); font-size: 14px; margin-top: 24px; }
@media (max-width: 900px) { .pk-grid { grid-template-columns: 1fr; } .pk { min-height: 0; } }

/* Clients: rows of names sliding against each other */
.clients { overflow: hidden; }
.cl-rows { margin-top: clamp(48px, 8vh, 90px); display: grid; gap: clamp(6px, 1vw, 14px); }
.cl-row { display: flex; gap: .5em; white-space: nowrap; width: max-content; font-family: var(--f-head); font-weight: 700; font-size: clamp(38px, 6.4vw, 116px); letter-spacing: -.045em; line-height: 1.05; will-change: transform; }
.cl-row span { transition: color .3s; }
.cl-row span:hover { color: var(--blue); }
.cl-row i { color: var(--orange); font-style: normal; }
.cl-row:nth-child(2) { margin-left: -30vw; -webkit-text-stroke: 1.5px var(--fg); color: transparent; }
.cl-row:nth-child(2) span:hover { color: var(--fg); }

/* Process + shop */
.proc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-top: clamp(40px, 7vh, 80px); counter-reset: s; }
.proc { counter-increment: s; border-top: 1.5px solid var(--fg); padding-top: 18px; }
.proc::before { content: "0" counter(s); font-family: var(--f-mono); font-size: 12px; color: var(--blue); }
.proc h3 { font-size: 24px; letter-spacing: -.02em; margin: 36px 0 10px; line-height: 1.1; }
.proc p { color: var(--muted); font-size: 15.5px; }
@media (max-width: 900px) { .proc-grid { grid-template-columns: 1fr 1fr; } }

.shop { display: grid; grid-template-columns: 1.1fr 1fr; gap: 0; background: var(--fg); color: var(--bg); border-radius: 28px; overflow: hidden; margin-top: clamp(80px, 14vh, 160px); }
.shop-body { padding: clamp(28px, 4vw, 64px); }
.shop .badge { display: inline-block; background: var(--orange); color: #fff; border-radius: 99px; padding: 5px 12px; margin-left: 10px; }
.shop h2 { font-size: clamp(32px, 3.8vw, 62px); margin-top: 24px; }
.shop p { opacity: .75; margin-top: 18px; max-width: 46ch; }
.shop-cats { background: var(--blue); color: #fff; padding: clamp(28px, 4vw, 64px); display: flex; flex-direction: column; justify-content: center; }
.shop-cats li { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 16px 0; border-bottom: 1px solid rgba(255,255,255,.3); font-family: var(--f-head); font-weight: 600; font-size: clamp(20px, 2vw, 30px); letter-spacing: -.02em; transition: padding .4s var(--ease); }
.shop-cats li:hover { padding-left: 14px; }
.shop-cats li span:last-child { width: 34px; height: 34px; border-radius: 50%; background: #fff; color: var(--blue); display: grid; place-items: center; font-size: 16px; flex: none; transition: background .3s, color .3s, translate .4s var(--ease); }
.shop-cats li:hover span:last-child { background: var(--orange); color: #fff; translate: 0 4px; }
.btn { display: inline-flex; align-items: center; gap: 10px; background: var(--blue); color: #fff; border-radius: 99px; padding: 14px 26px; font-weight: 500; margin-top: 32px; transition: background .3s, gap .3s var(--ease); }
.btn:hover { background: var(--orange); gap: 18px; }
@media (max-width: 900px) { .shop { grid-template-columns: 1fr; } }

/* Contact */
.contact h2 { font-size: clamp(72px, 17vw, 320px); letter-spacing: -.06em; line-height: .85; }
.contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: clamp(40px, 7vh, 80px); align-items: end; }
.contact-grid p { max-width: 40ch; font-size: clamp(18px, 1.5vw, 22px); }
.contact-links { display: grid; gap: 6px; font-family: var(--f-head); font-weight: 500; font-size: clamp(22px, 2.7vw, 44px); letter-spacing: -.03em; justify-items: start; }
.contact-links a { border-bottom: 2px solid transparent; transition: border-color .3s; overflow-wrap: anywhere; }
.contact-links a:hover { border-color: currentColor; }
.closing { display: flex; gap: .4em; flex-wrap: wrap; margin-top: clamp(60px, 10vh, 120px); font-family: var(--f-mono); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; opacity: .8; }
@media (max-width: 900px) { .contact-grid { grid-template-columns: 1fr; } }

footer { padding: 28px var(--gut); display: flex; justify-content: space-between; align-items: center; gap: 24px; flex-wrap: wrap; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); }
footer nav { display: flex; gap: 20px; }
footer a:hover { color: var(--fg); }
</style>
</head>
<body data-tone="base">

<header class="nav">
  <a class="logo" href="#top">The Social Company<em>.</em></a>
  <nav class="nav-links">
    <a href="#about" data-i18n="nav.about"></a>
    <a href="#services" data-i18n="nav.services"></a>
    <a href="#packages" data-i18n="nav.packages"></a>
    <a href="#clients" data-i18n="nav.clients"></a>
    <a href="#shop" data-i18n="nav.shop"></a>
    <a href="#contact" data-i18n="nav.contact"></a>
  </nav>
  <div data-controls></div>
</header>

<main id="top">
  <section class="hero" data-tone="base">
    <div class="wrap">
      <h1 data-i18n="hero.title"></h1>
      <div class="hero-foot">
        <p data-i18n="hero.sub"></p>
        <span class="mono">↓ <span data-i18n="hero.scroll"></span></span>
      </div>
    </div>
    <div class="hero-media" id="heroMedia" aria-hidden="true"></div>
  </section>

  <section class="about wrap" id="about" data-tone="blue">
    <div class="label mono" data-i18n="about.label"></div>
    <h2 class="h-xl" data-i18n="about.title" data-reveal></h2>
    <p class="about-text" id="aboutText" data-i18n="about.body"></p>
    <ul class="pills" id="industries"></ul>
  </section>

  <section class="why wrap" data-tone="base">
    <div class="label mono" data-i18n="why.label"></div>
    <h2 class="h-lg" data-i18n="why.title" data-reveal></h2>
    <p class="why-lead" data-i18n="why.lead" data-reveal></p>
    <div class="why-grid" id="whyGrid"></div>
  </section>

  <section class="svc" id="services" data-tone="soft">
    <div class="svc-track" id="svcTrack">
      <div class="svc-intro">
        <div class="label mono" data-i18n="services.label"></div>
        <h2 class="h-lg" data-i18n="services.title"></h2>
        <p class="mono"><span data-i18n="hero.scroll"></span> →</p>
      </div>
    </div>
  </section>

  <section class="stats wrap" data-tone="invert">
    <div class="label mono" data-i18n="stats.label"></div>
    <div class="stats-grid" id="statsGrid"></div>
  </section>

  <section class="packages wrap" id="packages" data-tone="ice">
    <div class="label mono" data-i18n="packages.label"></div>
    <h2 class="h-xl" data-i18n="packages.title" data-reveal></h2>
    <div class="pk-grid" id="pkGrid"></div>
    <p class="pk-note" data-i18n="packages.note"></p>
  </section>

  <section class="clients" id="clients" data-tone="base">
    <div class="wrap">
      <div class="label mono" data-i18n="clients.label"></div>
      <h2 class="h-xl" data-i18n="clients.title" data-reveal></h2>
    </div>
    <div class="cl-rows" id="clRows"></div>
  </section>

  <section class="wrap" id="shop" data-tone="soft">
    <div class="label mono" data-i18n="process.label"></div>
    <h2 class="h-lg" data-i18n="process.title" data-reveal></h2>
    <div class="proc-grid" id="procGrid"></div>

    <div class="shop" data-reveal>
      <div class="shop-body">
        <span class="mono" data-i18n="shop.label"></span><span class="badge mono" data-i18n="shop.badge"></span>
        <h2 data-i18n="shop.title"></h2>
        <p data-i18n="shop.body"></p>
        <a class="btn" href="#contact"><span data-i18n="shop.cta"></span> <span>→</span></a>
      </div>
      <ul class="shop-cats" id="shopCats"></ul>
    </div>
  </section>

  <section class="contact wrap" id="contact" data-tone="blue">
    <div class="label mono" data-i18n="contact.label"></div>
    <h2 data-i18n="contact.title" data-reveal></h2>
    <div class="contact-grid">
      <div>
        <p data-i18n="contact.body"></p>
        <p style="margin-top:12px;font-weight:700" data-i18n="contact.free"></p>
      </div>
      <div class="contact-links">
        <a data-email></a>
        <a data-ig></a>
      </div>
    </div>
    <div class="closing" id="closing"></div>
  </section>
</main>

<footer>
  <span data-i18n="footer.rights"></span>
  <span data-banners></span>
  <nav><a href="../index.html" data-i18n="ui.back"></a><a href="#top" data-i18n="footer.top"></a></nav>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
TSC.apply();
const $ = (s) => document.querySelector(s);

/* Build repeated content from the shared copy */
const svcNames = T.services.items.map(s => s.t);
$('#heroMedia').innerHTML = [0, 3, 5].map(o => { const r = [...svcNames.slice(o), ...svcNames.slice(0, o)]; return `<div class="hm-row">${[...r, ...r].map(n => `<span>${n}</span><i>✺</i>`).join('')}</div>`; }).join('');
$('#industries').innerHTML = T.industries.map((x, i) => `<li class="pill" data-reveal style="--i:${i}">${x}</li>`).join('');
$('#whyGrid').innerHTML = T.why.items.map((x, i) => `<div class="why-item" data-reveal style="--i:${i}"><span class="mono">0${i + 1}</span><h3>${x.t}</h3><p>${x.d}</p></div>`).join('');
$('#svcTrack').insertAdjacentHTML('beforeend',
  T.services.items.map((x, i) => `<article class="svc-card"><div class="svc-img k${i % 4}"><span class="svc-shape"></span><b>0${i + 1}</b></div><h3>${x.t}</h3><p>${x.d}</p><div class="tags">${x.tags}</div></article>`).join('') +
  `<div class="svc-addons"><div class="label mono">${T.services.addonsLabel}</div><ul>${T.services.addons.map(a => `<li class="pill">${a}</li>`).join('')}</ul></div>`);
$('#statsGrid').innerHTML = T.stats.items.map((x, i) => `<div class="stat" data-reveal style="--i:${i}"><div class="num"><small>${x.pre}</small><span data-count="${x.n}">${x.n}</span><small>${x.suf}</small></div><p>${x.l}</p></div>`).join('');
$('#pkGrid').innerHTML = T.packages.items.map((x, i) => `<article class="pk" data-reveal style="--i:${i}"><span class="mono">0${i + 1}</span><h3>${x.name}</h3><p class="who">${x.who}</p><ul>${x.feats.map(f => `<li>${f}</li>`).join('')}</ul><div class="price"><span>${T.packages.from}</span><b>€${x.price}</b><span>${T.packages.per}</span></div></article>`).join('');
const names = T.clients.items, rows = [names.slice(0, 4), names.slice(4, 7), names.slice(7)];
$('#clRows').innerHTML = rows.map(r => `<div class="cl-row">${[...r, ...r, ...r].map(n => `<span>${n}</span><i>✺</i>`).join('')}</div>`).join('');
$('#procGrid').innerHTML = T.process.items.map((x, i) => `<div class="proc" data-reveal style="--i:${i}"><h3>${x.t}</h3><p>${x.d}</p></div>`).join('');
$('#shopCats').innerHTML = T.shop.cats.map(c => `<li><span>${c}</span><span>↓</span></li>`).join('');
$('#closing').innerHTML = T.contact.closing.map(w => `<span>${w}</span>`).join('') + `<span>— ${T.contact.next}</span>`;

TSC.reveal();
TSC.counters();

/* Background tone follows the section crossing the middle of the screen */
const toneIO = new IntersectionObserver((es) => es.forEach(e => { if (e.isIntersecting) document.body.dataset.tone = e.target.dataset.tone; }), { rootMargin: '-50% 0px -50% 0px' });
document.querySelectorAll('section[data-tone]').forEach(s => toneIO.observe(s));

/* Nav hides on scroll down, returns on scroll up */
let lastY = 0;
addEventListener('scroll', () => { const y = scrollY; $('.nav').classList.toggle('hide', y > lastY && y > 300); lastY = y; }, { passive: true });

const heroChars = TSC.split($('.hero h1'), true);
const aboutWords = TSC.split($('#aboutText'));

if (window.gsap && !TSC.reduced) {
  gsap.registerPlugin(ScrollTrigger);

  gsap.from(heroChars, { yPercent: 115, duration: 1.2, ease: 'power4.out', stagger: .07, delay: .15 });
  gsap.from('.hero-foot > *', { opacity: 0, y: 24, duration: 1, stagger: .12, delay: .8, ease: 'power3.out' });

  /* Hero image opens from a framed card to full bleed */
  gsap.to('.hero-media', { clipPath: 'inset(0px 0px 0px 0px round 0px)', ease: 'none', scrollTrigger: { trigger: '.hero-media', start: 'top 85%', end: 'top 10%', scrub: true } });
  gsap.utils.toArray('.hm-row').forEach((row, i) => gsap.to(row, { x: i % 2 ? '26vw' : '-30vw', ease: 'none', scrollTrigger: { trigger: '.hero-media', start: 'top bottom', end: 'bottom top', scrub: .4 } }));

  /* About copy lights up word by word */
  gsap.fromTo(aboutWords, { opacity: .18 }, { opacity: 1, stagger: .08, ease: 'none', scrollTrigger: { trigger: '#aboutText', start: 'top 80%', end: 'bottom 50%', scrub: true } });

  /* Services: vertical scroll drives a horizontal gallery */
  const track = $('#svcTrack');
  const mm = gsap.matchMedia();
  mm.add('(min-width: 900px)', () => {
    const dist = () => track.scrollWidth - innerWidth;
    const tw = gsap.to(track, { x: () => -dist(), ease: 'none', scrollTrigger: { trigger: '.svc', pin: true, scrub: .5, end: () => '+=' + dist(), invalidateOnRefresh: true } });
    gsap.utils.toArray('.svc-shape').forEach(im => gsap.fromTo(im, { xPercent: -45 }, { xPercent: 25, ease: 'none', scrollTrigger: { trigger: im.parentNode, containerAnimation: tw, start: 'left right', end: 'right left', scrub: true } }));
  });

  /* Client rows slide in opposite directions */
  gsap.utils.toArray('.cl-row').forEach((row, i) => gsap.to(row, { x: i % 2 ? '18vw' : '-22vw', ease: 'none', scrollTrigger: { trigger: '.cl-rows', start: 'top bottom', end: 'bottom top', scrub: .4 } }));

  gsap.from('.contact-links a', { xPercent: -6, opacity: 0, stagger: .12, duration: 1, ease: 'power3.out', scrollTrigger: { trigger: '.contact-links', start: 'top 85%' } });
}
</script>
</body>
</html>

<!doctype html>
<html data-concept="c6" data-default-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Social Company — Concept 6: SocialOS</title>
<link rel="stylesheet" href="../shared/base.css">
<script src="../shared/content.js"></script>
<script src="../shared/core.js"></script>
<style>
/* SocialOS: the agency as a little computer. Every section is an app you can open, drag, resize and play with. */
:root[data-theme="light"] { --accent: #244BFF; --node: 36, 75, 255; --desk: #F2F2F0; }
:root[data-theme="dark"]  { --accent: #8FA4FF; --node: 120, 146, 255; --desk: #0C0C0D; --bg: #151517; }
html, body { height: 100%; overflow: hidden; }
body { background: var(--desk); user-select: none; -webkit-user-select: none; }
.mono { font-size: 11px; }
input, textarea, select { font: inherit; color: inherit; user-select: text; -webkit-user-select: text; }

/* Boot */
.boot { position: fixed; inset: 0; z-index: 999; background: #101010; color: #fff; display: grid; place-items: center; transition: opacity .6s, visibility .6s; }
.boot.off { opacity: 0; visibility: hidden; }
.boot-in { text-align: center; }
.boot-logo { font-family: var(--f-head); font-weight: 700; font-size: clamp(34px, 6vw, 84px); letter-spacing: -.05em; line-height: .95; }
.boot-logo i { display: inline-block; width: .5em; height: .5em; border-radius: 50%; background: var(--blue); margin: 0 .03em; animation: beat 1s ease-in-out infinite; }
@keyframes beat { 50% { scale: .75; background: var(--orange); } }
.boot-bar { width: 220px; height: 4px; background: rgba(255, 255, 255, .15); border-radius: 4px; margin: 28px auto 0; overflow: hidden; }
.boot-bar b { display: block; height: 100%; background: var(--blue); width: 0; animation: load 1.6s var(--ease) forwards; }
@keyframes load { to { width: 100%; } }
.boot button { margin-top: 26px; background: #fff; color: #101010; border-radius: 99px; padding: 13px 28px; font-weight: 700; opacity: 0; animation: fadeIn .5s 1.5s forwards; }
.boot button:hover { background: var(--orange); color: #fff; }
@keyframes fadeIn { to { opacity: 1; } }

/* Menubar */
.menubar { position: fixed; inset: 0 0 auto 0; height: 40px; z-index: 500; display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 0 14px; background: color-mix(in srgb, var(--bg) 80%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); font-size: 14px; }
.menubar .l, .menubar .r { display: flex; align-items: center; gap: 16px; min-width: 0; }
.mlogo { font-family: var(--f-head); font-weight: 700; letter-spacing: -.03em; white-space: nowrap; }
.mlogo i { display: inline-block; width: .5em; height: .5em; border-radius: 50%; background: var(--blue); margin: 0 1px; }
.menubar .l button:not(.mlogo) { color: var(--muted); white-space: nowrap; }
.menubar .l button:hover { color: var(--fg); }
.clock { font-family: var(--f-mono); font-size: 12px; white-space: nowrap; }
.fund { position: relative; }
.fund > button { font-family: var(--f-mono); font-size: 11px; border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; }
.fund-pop { position: absolute; right: 0; top: 30px; background: #fff; border: 1.5px solid #101010; border-radius: 12px; padding: 12px 14px; display: none; white-space: nowrap; }
:root[data-theme="dark"] .fund-pop { background: #101010; border-color: #fff; }
.fund.open .fund-pop { display: block; }
@media (max-width: 760px) { .menubar .l button:not(.mlogo), .clock { display: none; } }

/* Desktop */
#wall { position: fixed; inset: 0; width: 100%; height: 100%; }
body[data-wall="blobs"] { background: radial-gradient(60vw 60vw at 15% 20%, rgba(36, 75, 255, .5), transparent 60%), radial-gradient(50vw 50vw at 85% 80%, rgba(255, 100, 46, .45), transparent 60%), var(--desk); }
.desk { position: fixed; inset: 52px auto 96px 12px; display: flex; flex-direction: column; flex-wrap: wrap; align-content: flex-start; gap: 6px 10px; z-index: 1; }
.ic { width: 92px; padding: 8px 4px; border-radius: 12px; display: grid; justify-items: center; gap: 6px; text-align: center; font-size: 12.5px; font-weight: 500; line-height: 1.2; }
.ic:hover, .ic:focus-visible { background: color-mix(in srgb, var(--accent) 16%, transparent); }
.tile { width: 54px; height: 54px; border-radius: 15px; display: grid; place-items: center; font-family: var(--f-head); font-weight: 700; font-size: 24px; color: #fff; background: var(--blue); box-shadow: 0 4px 14px rgba(0, 0, 0, .14); transition: scale .3s var(--ease), rotate .3s var(--ease); }
.ic:hover .tile, .dock button:hover .tile { scale: 1.1; rotate: -4deg; }
.t-o { background: var(--orange); } .t-k { background: #101010; } .t-w { background: #fff; color: #101010; } .t-i { background: var(--ice); color: var(--blue); }
:root[data-theme="dark"] .t-k { background: #fff; color: #101010; }
.note { position: fixed; right: 18px; top: 60px; width: 210px; background: #FFE9A8; color: #101010; padding: 16px; font-size: 14px; line-height: 1.45; rotate: 2deg; box-shadow: 0 10px 30px rgba(0, 0, 0, .18); z-index: 2; cursor: grab; }
.note b { font-family: var(--f-head); font-size: 18px; display: block; margin-bottom: 6px; }
.note kbd { font-family: var(--f-mono); font-size: 11px; background: rgba(0, 0, 0, .1); border-radius: 4px; padding: 1px 5px; }
@media (max-width: 760px) { .desk { inset: 50px 8px 92px 8px; flex-direction: row; } .ic { width: calc(25% - 8px); } .note { display: none; } }

/* Dock */
.dock { position: fixed; left: 50%; bottom: 12px; translate: -50% 0; z-index: 500; display: flex; gap: 8px; padding: 8px 10px; border-radius: 22px; border: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 75%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); max-width: calc(100% - 16px); overflow-x: auto; }
.dock button { position: relative; flex: none; }
.dock .tile { width: 46px; height: 46px; border-radius: 13px; font-size: 20px; }
.dock button.run::after { content: ""; position: absolute; left: 50%; bottom: -6px; width: 5px; height: 5px; border-radius: 50%; background: var(--fg); translate: -50% 0; }

/* Windows */
.win { position: fixed; z-index: 10; display: flex; flex-direction: column; min-width: 300px; min-height: 220px; max-width: 100vw; max-height: calc(100vh - 40px); background: var(--bg); color: var(--fg); border: 1.5px solid var(--fg); border-radius: 16px; overflow: hidden; resize: both; box-shadow: 0 24px 70px rgba(0, 0, 0, .25); animation: winIn .35s var(--ease); }
@keyframes winIn { from { opacity: 0; scale: .92; } }
.win.min { display: none; }
.win.max { left: 0 !important; top: 40px !important; width: 100vw !important; height: calc(100vh - 40px - 78px) !important; border-radius: 0; resize: none; }
.bar { flex: none; display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-bottom: 1.5px solid var(--fg); cursor: grab; touch-action: none; background: var(--card); }
.win.top .bar { background: var(--blue); color: #fff; }
.bar b { font-family: var(--f-head); font-size: 15px; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dots { display: flex; gap: 7px; }
.dots button { width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid currentColor; }
.dots .x { background: var(--orange); border-color: var(--orange); }
.dots button:hover { background: currentColor; }
.body { flex: 1; overflow: auto; padding: 20px; user-select: text; -webkit-user-select: text; }
.body h2 { font-size: clamp(28px, 3vw, 44px); margin-bottom: 12px; }
.body h3 { font-size: 20px; letter-spacing: -.02em; line-height: 1.1; }
.body p { color: var(--muted); }
.lead { font-size: 18px; color: var(--fg) !important; max-width: 52ch; }
.btn { display: inline-flex; gap: 8px; align-items: center; background: var(--blue); color: #fff; border-radius: 99px; padding: 10px 18px; font-weight: 700; font-size: 15px; transition: background .2s; }
.btn:hover { background: var(--orange); }
.btn.ghost { background: none; color: var(--fg); box-shadow: inset 0 0 0 1.5px var(--fg); }
.btn.ghost:hover { background: var(--fg); color: var(--bg); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); border-radius: 99px; padding: 4px 11px; font-size: 13px; }
hr { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }
@media (max-width: 760px) { .win { left: 0 !important; top: 40px !important; width: 100vw !important; height: calc(100vh - 40px - 78px) !important; border-radius: 0; resize: none; border-width: 1.5px 0; } }

/* App: hello */
.hello-h { font-size: clamp(72px, 11vw, 150px) !important; letter-spacing: -.06em; line-height: .85; margin-bottom: 14px !important; }
.hello-h span { color: var(--orange); }
.why { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 22px; }
.why .mono { color: var(--orange); }
.nums { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.nums div { background: var(--card); border-radius: 14px; padding: 14px; }
.nums b { font-family: var(--f-head); font-size: clamp(24px, 3vw, 40px); letter-spacing: -.04em; display: block; line-height: 1; }
.nums span { font-size: 12.5px; color: var(--muted); }
@media (max-width: 700px) { .why { grid-template-columns: 1fr; } .nums { grid-template-columns: 1fr 1fr; } }

/* App: services */
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; height: 100%; }
.files { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; align-content: start; }
.files .ic { width: auto; }
.files .ic.on { background: var(--blue); color: #fff; }
.pane { background: var(--card); border-radius: 16px; padding: 20px; align-self: start; }
.pane .big { font-family: var(--f-head); font-size: 54px; letter-spacing: -.05em; line-height: .8; color: var(--orange); }
.pane h3 { font-size: 30px; margin: 14px 0 8px; }
.pane .mono { display: block; margin-top: 12px; color: var(--accent); }
@media (max-width: 700px) { .split { grid-template-columns: 1fr; height: auto; } }

/* App: packages */
.pkname { font-family: var(--f-head); font-weight: 700; font-size: clamp(40px, 6vw, 76px); letter-spacing: -.05em; line-height: 1; }
.price { display: flex; align-items: baseline; gap: 8px; margin: 12px 0; }
.price b { font-family: var(--f-head); font-size: 56px; letter-spacing: -.05em; color: var(--accent); line-height: 1; }
.range { -webkit-appearance: none; appearance: none; width: 100%; height: 44px; border-radius: 99px; background: linear-gradient(90deg, var(--blue) var(--fill, 50%), var(--line) var(--fill, 50%)); margin: 8px 0; cursor: grab; }
.range::-webkit-slider-thumb { -webkit-appearance: none; width: 44px; height: 44px; border-radius: 50%; background: var(--orange); border: 4px solid var(--bg); }
.range::-moz-range-thumb { width: 36px; height: 36px; border-radius: 50%; background: var(--orange); border: 4px solid var(--bg); }
.feats li { padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.feats li::before { content: "+ "; color: var(--orange); font-family: var(--f-mono); }

/* App: clients + deck */
.clist button { display: flex; justify-content: space-between; gap: 12px; width: 100%; text-align: left; padding: 11px 10px; border-bottom: 1px solid var(--line); border-radius: 8px; font-family: var(--f-head); font-weight: 600; font-size: 17px; letter-spacing: -.02em; }
.clist button span { font-family: var(--f-mono); font-size: 11px; color: var(--muted); font-weight: 400; white-space: nowrap; }
.clist button:hover, .clist button.on { background: var(--blue); color: #fff; }
.clist button:hover span, .clist button.on span { color: #fff; }
.deck { display: flex; flex-direction: column; height: 100%; gap: 10px; }
.deck-stage { flex: 1; min-height: 0; display: grid; place-items: center; background: var(--card); border-radius: 12px; overflow: auto; }
.deck-stage canvas { max-width: 100%; max-height: 100%; }
.deck-ui { display: flex; justify-content: space-between; align-items: center; gap: 10px; }

/* App: shop */
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.prod { aspect-ratio: 3 / 4; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; color: #fff; background: var(--blue); transition: rotate .3s var(--ease), scale .3s var(--ease); cursor: pointer; text-align: left; }
.prod:nth-child(5n + 2) { background: var(--ice); color: #101010; } .prod:nth-child(5n + 3) { background: var(--orange); } .prod:nth-child(5n + 4) { background: #101010; } .prod:nth-child(5n + 5) { background: var(--card); color: var(--fg); }
.prod:hover { rotate: -3deg; scale: 1.04; }
.prod h3 { font-size: 19px; }

/* App: mail */
.mail label { display: block; font-family: var(--f-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 12px 0 4px; }
.mail input, .mail select, .mail textarea { width: 100%; background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.mail textarea { min-height: 110px; resize: vertical; }
.mail input:focus, .mail select:focus, .mail textarea:focus { outline: 0; border-color: var(--accent); }
.nextsteps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 8px; }
.nextsteps div { border-top: 1.5px solid var(--fg); padding-top: 8px; font-size: 13px; color: var(--muted); }
.nextsteps b { display: block; color: var(--fg); font-family: var(--f-head); font-size: 15px; }
@media (max-width: 700px) { .nextsteps { grid-template-columns: 1fr 1fr; } }

/* App: post maker */
.maker { display: grid; grid-template-columns: minmax(0, 1fr) 200px; gap: 16px; height: 100%; }
.maker canvas { width: 100%; max-height: 100%; aspect-ratio: 1; border-radius: 12px; border: 1.5px solid var(--line); touch-action: none; cursor: grab; object-fit: contain; }
.sw { display: flex; gap: 6px; flex-wrap: wrap; }
.sw button { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--line); }
.sw button.on { outline: 2px solid var(--orange); outline-offset: 2px; }
.stk { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.stk button { aspect-ratio: 1; border-radius: 10px; background: var(--card); font-size: 20px; font-family: var(--f-head); font-weight: 700; }
.stk button:hover { background: var(--blue); color: #fff; }
.maker h4 { font-family: var(--f-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 14px 0 6px; font-weight: 400; }
.maker input[type=text] { width: 100%; background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 10px; }
@media (max-width: 700px) { .maker { grid-template-columns: 1fr; height: auto; } }

/* App: game */
.game { display: grid; grid-template-columns: 240px 1fr; gap: 18px; height: 100%; }
.phone { position: relative; height: 100%; min-height: 330px; border: 3px solid var(--fg); border-radius: 30px; overflow: hidden; background: var(--card); }
.feed { position: absolute; inset: 0; }
.post { position: absolute; left: 10px; right: 10px; height: 96px; border-radius: 14px; background: var(--bg); border: 1px solid var(--line); padding: 10px 12px; font-size: 13px; color: var(--muted); display: flex; flex-direction: column; justify-content: space-between; will-change: transform; }
.post i { display: block; height: 8px; width: 60%; background: var(--line); border-radius: 4px; }
.post.star { background: var(--orange); color: #fff; border-color: var(--orange); font-family: var(--f-head); font-weight: 700; font-size: 17px; }
.zone { position: absolute; left: 4px; right: 4px; top: 50%; height: 112px; translate: 0 -50%; border: 2.5px dashed var(--accent); border-radius: 18px; pointer-events: none; }
.zone.hit { border-style: solid; border-color: var(--orange); background: rgba(255, 100, 46, .15); }
.zone.miss { border-color: #e11; animation: shake .3s; }
@keyframes shake { 25% { translate: -5px -50%; } 75% { translate: 5px -50%; } }
.score { font-family: var(--f-head); font-weight: 700; font-size: 72px; letter-spacing: -.05em; line-height: .9; }
.stop { width: 100%; padding: 20px; border-radius: 18px; background: var(--orange); color: #fff; font-family: var(--f-head); font-weight: 700; font-size: 26px; margin-top: 14px; transition: scale .1s; }
.stop:active { scale: .96; }
@media (max-width: 700px) { .game { grid-template-columns: 1fr; height: auto; } .phone { height: 340px; } }

/* App: terminal */
.term { background: #0B0B0C; color: #D7DEFF; font-family: var(--f-mono); font-size: 13.5px; line-height: 1.55; padding: 14px !important; display: flex; flex-direction: column; }
.term .out { flex: 1; white-space: pre-wrap; overflow-wrap: anywhere; }
.term .out b { color: var(--orange); font-weight: 400; } .term .out u { color: #8FA4FF; text-decoration: none; }
.term form { display: flex; gap: 8px; }
.term form span { color: var(--orange); }
.term input { flex: 1; background: none; border: 0; outline: 0; color: #fff; font-family: var(--f-mono); font-size: 13.5px; }

/* App: beats */
.pads { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.pad { aspect-ratio: 1; border-radius: 16px; background: var(--card); font-family: var(--f-mono); font-size: 12px; display: grid; place-items: center; transition: scale .08s, background .15s, color .15s; }
.pad.hit { background: var(--blue); color: #fff; scale: .94; }
.pad:nth-child(even).hit { background: var(--orange); }

/* App: settings / trash */
.walls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.walls button { aspect-ratio: 16 / 10; border-radius: 10px; border: 1.5px solid var(--line); font-size: 12px; background: var(--card); }
.walls button.on { border-color: var(--orange); box-shadow: 0 0 0 2px var(--orange); }
.tlist button { display: flex; gap: 10px; width: 100%; padding: 10px; border-bottom: 1px solid var(--line); text-align: left; font-family: var(--f-mono); font-size: 13px; }
.tlist button:hover { background: var(--card); }

.capline { font-family: var(--f-head); font-weight: 700; font-size: clamp(26px, 3.4vw, 40px); letter-spacing: -.03em; line-height: 1.08; color: var(--fg) !important; margin: 12px 0 20px; min-height: 3.3em; }
.capline.pop { animation: winIn .35s var(--ease); }
.cprev { margin-top: 14px; border-radius: 12px; border: 1px solid var(--line); overflow: hidden; background: var(--card); cursor: zoom-in; }
.cprev canvas { display: block; width: 100%; height: auto; }

/* Toast, finale, confetti */
.toast { position: fixed; left: 50%; bottom: 96px; translate: -50% 20px; z-index: 900; background: var(--fg); color: var(--bg); border-radius: 99px; padding: 10px 18px; font-size: 14px; opacity: 0; transition: opacity .3s, translate .3s; pointer-events: none; max-width: 90vw; text-align: center; }
.toast.on { opacity: 1; translate: -50% 0; }
.finale { position: fixed; inset: 0; z-index: 950; background: #101010; color: #fff; display: none; place-items: center; font-family: var(--f-head); font-weight: 700; font-size: clamp(64px, 17vw, 300px); letter-spacing: -.06em; }
.finale.on { display: grid; }
.finale span { animation: zoom .8s var(--ease); }
@keyframes zoom { from { scale: 1.6; opacity: 0; filter: blur(18px); } }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 960; pointer-events: none; }
</style>
</head>
<body data-wall="net">

<div class="boot" id="boot"><div class="boot-in">
  <div class="boot-logo">The S<i></i>cial Company</div>
  <div class="boot-bar"><b></b></div>
  <p class="mono" id="bootLine" style="margin-top:16px;opacity:.7;min-height:1.5em"></p>
  <button type="button" id="bootBtn"></button>
</div></div>

<header class="menubar">
  <div class="l"><button class="mlogo" data-open="hello">S<i></i>cialOS</button><span id="menuApps" class="l"></span></div>
  <div class="r">
    <div class="fund" id="fund"><button type="button" aria-label="EU / CY">EU</button><div class="fund-pop"><span data-banners></span></div></div>
    <div data-controls></div>
    <span class="clock" id="clock"></span>
  </div>
</header>

<canvas id="wall" aria-hidden="true"></canvas>
<div class="desk" id="desk"></div>
<div class="note" id="note"></div>
<div id="wins"></div>
<nav class="dock" id="dock"></nav>
<div class="toast" id="toast"></div>
<div class="finale" id="finale"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<script>
TSC.apply();
const $ = (s, r) => (r || document).querySelector(s), $$ = (s, r) => [...(r || document).querySelectorAll(s)];
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const el = TSC.lang === 'el', mobile = () => innerWidth < 760;
const store = { get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };

/* ---------- Copy for the OS itself ---------- */
const L = el ? {
  start: 'Εκκίνηση', apps: { hello: 'Γεια', services: 'Υπηρεσίες', packages: 'Πακέτα', clients: 'Πελάτες', deck: 'HELLO.pdf', shop: 'Κατάστημα', mail: 'Αλληλογραφία', maker: 'Φτιάξε ανάρτηση', game: 'Σταμάτα την κύλιση', term: 'Τερματικό', beats: 'Ρυθμοί', settings: 'Ρυθμίσεις', trash: 'Κάδος', caption: 'Μηχανή λεζάντας' },

/* ---------- The deck (your HELLO pdf), loaded only when first opened ---------- */
let deckP = null, deckText = null;
function getDeck() {
  if (!deckP) deckP = new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s); })
    .then(() => { pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; return pdfjsLib.getDocument('../assets/hello.pdf').promise; });
  return deckP;
}
async function casePage(client) {
  const d = await getDeck();
  if (!deckText) { deckText = []; for (let p = 1; p <= d.numPages; p++) { const t = await (await d.getPage(p)).getTextContent(); deckText[p] = t.items.map(i => i.str).join(' ').toLowerCase(); } }
  const key = client.toLowerCase().split(' ').slice(0, 2).join(' ');
  return deckText.findIndex(t => t && t.includes('case study') && t.includes(key));
}
let prevChain = Promise.resolve();
function casePreview(client, box) {
  prevChain = prevChain.then(async () => {
    try { const page = await casePage(client); if (page < 1 || !document.body.contains(box)) return;
      const pg = await (await getDeck()).getPage(page), v = pg.getViewport({ scale: 900 / pg.getViewport({ scale: 1 }).width }), cv = $('canvas', box);
      cv.width = v.width; cv.height = v.height; await pg.render({ canvasContext: cv.getContext('2d'), viewport: v }).promise; box.hidden = false; box.onclick = () => openDeck(client);
    } catch (e) {}

}
async function openDeck(client) {
  const win = open('deck');
  try { const page = await casePage(client); if (page > 0) win.deckShow(page); } catch (e) {}
}

/* ---------- Window manager ---------- */
let z = 20, cascade = 0;
function focusWin(w) { $$('.win').forEach(n => n.classList.toggle('top', n === w)); w.style.zIndex = ++z; w.classList.remove('min'); }
function open(id) {
  let w = $(`.win[data-app="${id}"]`);
  if (w) { focusWin(w); return w; }
  const a = APPS[id], W = Math.min(a.w, innerWidth - 24), Hh = Math.min(a.h, innerHeight - 140);
  w = document.createElement('section'); w.className = 'win'; w.dataset.app = id;
  w.style.cssText = `left:${clamp(120 + (cascade % 6) * 34 + (innerWidth - 1100) * .2, 8, Math.max(8, innerWidth - W - 8))}px;top:${56 + (cascade % 6) * 26}px;width:${W}px;height:${Hh}px`; cascade++;
  w.innerHTML = `<header class="bar"><span class="dots"><button class="x" aria-label="close"></button><button class="mn" aria-label="minimise"></button><button class="mx" aria-label="maximise"></button></span><b>${L.apps[id]}</b></header><div class="body"></div>`;
  $('#wins').appendChild(w); a.render($('.body', w), w); focusWin(w); syncDock();
  return w;
}
function closeWin(w) { w.remove(); syncDock(); }
function syncDock() { $$('#dock button').forEach(b => b.classList.toggle('run', !!$(`.win[data-app="${b.dataset.open}"]`))); }

  const w = e.target.closest('.win'); if (w) focusWin(w);

  const r = w.getBoundingClientRect(), dx = e.clientX - r.left, dy = e.clientY - r.top; bar.setPointerCapture(e.pointerId);
  const mv = (ev) => { w.style.left = clamp(ev.clientX - dx, -r.width + 80, innerWidth - 80) + 'px'; w.style.top = clamp(ev.clientY - dy, 40, innerHeight - 60) + 'px'; };
  const up = () => { bar.removeEventListener('pointermove', mv); bar.removeEventListener('pointerup', up); };
  bar.addEventListener('pointermove', mv); bar.addEventListener('pointerup', up);

document.addEventListener('click', (e) => {
  const o = e.target.closest('[data-open]'); if (o) { open(o.dataset.open); return; }
  const w = e.target.closest('.win'); if (!w) return;

/* ---------- Wallpaper ---------- */
function setWall(w) { document.body.dataset.wall = w; store.set('tsc-wall', w); }
setWall(store.get('tsc-wall') || 'net');
(function () {
  const cv = $('#wall'), c = cv.getContext('2d'); let w, h, nodes = [], m = null, t = 0;
  function size() { const d = Math.min(devicePixelRatio || 1, 2); w = innerWidth; h = innerHeight; cv.width = w * d; cv.height = h * d; c.setTransform(d, 0, 0, d, 0, 0); nodes = Array.from({ length: Math.round(clamp(w * h / 17000, 28, 90)) }, (_, i) => ({ x: Math.random() * w, y: Math.random() * h, vx: (Math.random() - .5) * .5, vy: (Math.random() - .5) * .5, r: 1.5 + Math.random() * 2.5, hot: i % 9 === 0 })); }

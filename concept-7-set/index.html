<!doctype html>
<html data-concept="c7" data-default-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Social Company — Concept 7: On Set</title>
<link rel="stylesheet" href="../shared/base.css">
<script src="../shared/content.js"></script>
<script src="../shared/core.js"></script>
<style>
/* On Set: the page is a film set. Lights. Camera. Action. Almost everything can be grabbed, spun, flipped or thrown;
   every scene also has a plain readable state (Reset, Tidy, front card, lights on). */
:root[data-theme="light"] { --accent: #244BFF; --soft: #DCE5FF; }
:root[data-theme="dark"]  { --accent: #8FA4FF; --soft: #141C40; --bg: #0C0C0D; }
body { background: var(--bg); }
.wrap { max-width: 1400px; margin-inline: auto; padding-inline: var(--gut); }
.scene { position: relative; }
/* each scene opens like a camera iris as it scrolls in */
.iris { background: var(--sbg, var(--bg)); color: var(--sfg, var(--fg)); padding-block: clamp(80px, 13vh, 160px); clip-path: circle(var(--r, 200vmax) at 50% 0); position: relative; overflow: hidden; }
.label { display: inline-flex; align-items: center; gap: 10px; opacity: .75; margin-bottom: clamp(18px, 3vh, 34px); }
.label::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--orange); }
.h { font-size: clamp(40px, 6.4vw, 108px); max-width: 13ch; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; }
.tool { font-family: var(--f-mono); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; border: 1.5px solid currentColor; border-radius: 99px; padding: 8px 14px; transition: background .2s, color .2s; }
.tool:hover, .tool.on { background: var(--orange); border-color: var(--orange); color: #fff; }
.head { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; }

/* Nav + cursor hint */
.nav { position: fixed; inset: 0 0 auto 0; z-index: 80; display: flex; justify-content: space-between; align-items: center; padding: 12px var(--gut); pointer-events: none; }
/* logo and controls sit on their own pills so they stay readable over every scene colour */
.nav > * { pointer-events: auto; background: color-mix(in srgb, var(--bg) 82%, transparent); color: var(--fg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--line); border-radius: 99px; padding: 8px 14px; }
.logo { font-family: var(--f-head); font-weight: 700; font-size: 18px; letter-spacing: -.03em; white-space: nowrap; }
@media (max-width: 700px) { .logo { font-size: 14px; } .hero-tools { top: auto !important; bottom: 46%; left: var(--gut); right: auto !important; } .hero-copy { top: 84px !important; right: var(--gut); } }
.logo i { display: inline-block; width: .5em; height: .5em; border-radius: 50%; background: currentColor; margin: 0 1px; }
.hintcur { position: fixed; left: 0; top: 0; z-index: 90; pointer-events: none; background: var(--orange); color: #fff; font-family: var(--f-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; padding: 6px 10px; border-radius: 99px; margin: 18px 0 0 18px; opacity: 0; scale: .6; transition: opacity .2s, scale .25s var(--ease); white-space: nowrap; }
.hintcur.on { opacity: 1; scale: 1; }

/* 1. Hero: letters with weight */
.hero .iris { padding: 0; height: 100svh; min-height: 620px; clip-path: none; }
#stage { position: absolute; inset: 0; }
.hero-copy { position: absolute; left: var(--gut); top: 96px; max-width: 46ch; z-index: 2; pointer-events: none; }
.hero-copy p { font-size: clamp(17px, 1.4vw, 21px); margin-top: 14px; }
.hero-tools { position: absolute; right: var(--gut); top: 96px; z-index: 3; }
.gl { position: absolute; left: 0; top: 0; font-family: var(--f-head); font-weight: 700; line-height: 1; letter-spacing: 0; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; will-change: transform; transition: color .2s; }
.gl:active { cursor: grabbing; color: var(--accent); }
.gl.dot { border-radius: 50%; background: var(--orange); }
.gl.prop { border-radius: 50%; border: 14px solid var(--blue); }
.gl.prop.sq { border-radius: 18%; border: 0; background: var(--soft); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

/* 2. About */
.about p { font-family: var(--f-head); font-weight: 500; font-size: clamp(26px, 3.6vw, 60px); letter-spacing: -.03em; line-height: 1.13; max-width: 1250px; }
.inds { display: flex; flex-wrap: wrap; gap: 10px; margin-top: clamp(32px, 5vh, 56px); }
.inds li { border: 1.5px solid var(--line); border-radius: 99px; padding: 9px 18px; font-size: 16px; will-change: transform; background: var(--bg); }

/* 3. Lights */
.lights .iris { --sbg: #08080A; --sfg: #fff; }
.cone { position: absolute; left: 0; top: 0; width: 760px; height: 760px; margin: -380px 0 0 -380px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 244, 214, .2), rgba(255, 244, 214, .06) 40%, transparent 68%); pointer-events: none; opacity: 0; transition: opacity .4s; }
.lights:hover .cone { opacity: 1; }
.lights.lit .cone { opacity: 0; }
.why { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(20px, 3vw, 44px); margin-top: clamp(36px, 6vh, 64px); }
.li { border-top: 1.5px solid rgba(255, 255, 255, .35); padding-top: 18px; opacity: var(--o, .42); transition: opacity .25s; }
.lights.lit .li { opacity: 1; }
.li .mono { color: var(--orange); }
.li h3 { font-size: clamp(30px, 4.2vw, 68px); letter-spacing: -.045em; margin: 10px 0; }
.li p { max-width: 38ch; font-size: clamp(16px, 1.3vw, 20px); color: rgba(255, 255, 255, .8); }
@media (max-width: 800px) { .why { grid-template-columns: 1fr; } }

/* 4. Services: a ring you spin */
.svc .iris { --sbg: var(--soft); }
.ringbox { position: relative; height: clamp(400px, 56vh, 520px); margin-top: clamp(24px, 4vh, 48px); perspective: 1500px; cursor: grab; touch-action: pan-y; }
.ringbox:active { cursor: grabbing; }
.ring { position: absolute; left: 50%; top: 50%; width: var(--cw); height: var(--ch); margin: calc(var(--ch) / -2) 0 0 calc(var(--cw) / -2); transform-style: preserve-3d; will-change: transform; --cw: 320px; --ch: 400px; }
.rc { position: absolute; inset: 0; border-radius: 26px; background: var(--bg); color: var(--fg); padding: 24px; display: flex; flex-direction: column; justify-content: space-between; backface-visibility: hidden; -webkit-backface-visibility: hidden; border: 1.5px solid var(--line); transition: background .4s, color .4s, opacity .4s; opacity: .55; user-select: none; -webkit-user-select: none; }
.rc.on { background: var(--blue); color: #fff; border-color: var(--blue); opacity: 1; }
.rc .n { font-family: var(--f-head); font-weight: 700; font-size: 88px; letter-spacing: -.06em; line-height: .8; color: var(--orange); }
.rc.on .n { color: #fff; }
.rc h3 { font-size: 30px; letter-spacing: -.035em; line-height: 1.02; }
.rc p { font-size: 15.5px; margin-top: 10px; opacity: .85; }
.rc .mono { display: block; margin-top: 12px; font-size: 10.5px; opacity: .8; }
.ring-ui { display: flex; justify-content: center; align-items: center; gap: 16px; margin-top: 18px; }
.ring-ui button { width: 48px; height: 48px; border-radius: 50%; border: 1.5px solid currentColor; font-size: 18px; transition: background .2s, color .2s; }
.ring-ui button:hover { background: var(--fg); color: var(--bg); }
.addons { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 26px; }
.addons span { border: 1.5px solid var(--line); border-radius: 99px; padding: 6px 14px; font-size: 14px; }
@media (max-width: 700px) { .ring { --cw: 250px; --ch: 370px; } .rc { padding: 18px; } .rc .n { font-size: 64px; } .rc h3 { font-size: 24px; } .rc p { font-size: 14px; } }

/* 5. Camera: client photos on a table */
.board { position: relative; height: clamp(560px, 82vh, 800px); margin-top: clamp(24px, 4vh, 44px); }
.pol { position: absolute; width: clamp(140px, 15vw, 210px); background: #fff; color: #101010; padding: 9px 9px 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, .2); cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; transition: box-shadow .3s, scale .3s var(--ease); will-change: transform; }
.pol:hover { box-shadow: 0 22px 50px rgba(0, 0, 0, .3); scale: 1.04; z-index: 50 !important; }
.pol .ph { aspect-ratio: 4 / 3; background: var(--blue); color: #fff; display: grid; place-items: center; font-family: var(--f-head); font-weight: 700; font-size: 34px; letter-spacing: -.04em; overflow: hidden; }
.pol:nth-child(3n) .ph { background: var(--orange); } .pol:nth-child(3n + 1) .ph { background: #101010; }
.pol canvas { width: 100%; height: 100%; object-fit: cover; display: block; }
.pol b { display: block; font-family: var(--f-head); font-size: 14.5px; letter-spacing: -.01em; line-height: 1.15; margin-top: 9px; }
.pol span { font-family: var(--f-mono); font-size: 10.5px; color: #5E5E5E; }
.board.tidy { height: auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 18px; }
.board.tidy .pol { position: static; width: auto; transform: none !important; }
@media (max-width: 800px) { .board { height: 640px; } .board.tidy { grid-template-columns: 1fr 1fr; } }
.flash { position: fixed; inset: 0; background: #fff; z-index: 200; opacity: 0; pointer-events: none; }
.flash.go { animation: flash .5s; }
@keyframes flash { 10% { opacity: 1; } 100% { opacity: 0; } }
.focus { position: fixed; inset: 0; z-index: 190; background: rgba(8, 8, 10, .88); display: none; place-items: center; padding: 20px; }
.focus.on { display: grid; }
.focus-card { background: #fff; color: #101010; max-width: min(980px, 100%); max-height: 100%; overflow: auto; padding: 14px 14px 20px; animation: develop .6s var(--ease); }
@keyframes develop { from { scale: .8; rotate: -4deg; opacity: 0; } }
.focus-card canvas { width: 100%; height: auto; display: block; background: #eee; }
.focus-card h3 { font-size: clamp(24px, 3vw, 40px); margin-top: 14px; }
.focus-card .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.focus-card .chips span { border: 1.5px solid rgba(16, 16, 16, .2); border-radius: 99px; padding: 4px 12px; font-size: 13.5px; }
.focus-x { position: absolute; right: 18px; top: 18px; color: #fff; font-family: var(--f-mono); font-size: 13px; border: 1.5px solid #fff; border-radius: 99px; padding: 8px 14px; }

/* 6. Packages: cards that tilt and flip */
.pk3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: clamp(32px, 5vh, 56px); perspective: 1600px; }
.pkc { position: relative; min-height: 440px; transform-style: preserve-3d; transition: transform .8s var(--ease); transform: rotateX(var(--rx, 0deg)) rotateY(calc(var(--ry, 0deg) + var(--flip, 0deg))); cursor: pointer; text-align: left; }
.pkc.fl { --flip: 180deg; }
.pkc.tilting { transition: transform .12s linear; }
.face { position: absolute; inset: 0; border-radius: 26px; padding: clamp(22px, 2.2vw, 34px); backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; flex-direction: column; overflow: hidden; }
.front { background: var(--card); }
.pkc:nth-child(2) .front { background: var(--blue); color: #fff; }
.front::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(380px circle at var(--mx, 50%) var(--my, 0%), rgba(255, 255, 255, .35), transparent 60%); opacity: 0; transition: opacity .3s; }
.pkc:hover .front::after { opacity: 1; }
.back { background: var(--fg); color: var(--bg); transform: rotateY(180deg); }
.face h3 { font-size: clamp(30px, 3vw, 46px); }
.face .who { margin-top: 12px; opacity: .78; font-size: 16px; }
.face .price { margin-top: auto; display: flex; align-items: baseline; gap: 8px; }
.face .price b { font-family: var(--f-head); font-size: clamp(56px, 5.4vw, 88px); letter-spacing: -.05em; line-height: 1; }
.face .price span, .face .turn { font-family: var(--f-mono); font-size: 11px; text-transform: uppercase; opacity: .7; }
.face .turn { margin-top: 14px; }
.back li { padding: 11px 0; border-bottom: 1px solid color-mix(in srgb, var(--bg) 25%, transparent); font-size: 15.5px; }
.back a { margin-top: auto; align-self: flex-start; background: var(--orange); color: #fff; border-radius: 99px; padding: 11px 20px; font-weight: 700; }
.note { opacity: .7; font-size: 14px; margin-top: 20px; }
@media (max-width: 900px) { .pk3 { grid-template-columns: 1fr; } .pkc { min-height: 380px; } }

/* 7. Process: a line that draws itself */
.proc .iris { --sbg: var(--blue); --sfg: #fff; }
.track { margin-top: clamp(28px, 5vh, 56px); }
.track svg { width: 100%; height: auto; overflow: visible; display: block; }
.track path { fill: none; stroke-width: 3; vector-effect: non-scaling-stroke; stroke-linecap: round; }
.track .bg { stroke: rgba(255, 255, 255, .25); stroke-dasharray: 2 12; }
.track .fg { stroke: #fff; }
.track circle { fill: var(--orange); }
.stations { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-top: 18px; }
.stn { opacity: .4; transition: opacity .5s, translate .5s var(--ease); translate: 0 10px; }
.stn.on { opacity: 1; translate: 0 0; }
.stn .mono { color: #FFC2AD; }
.stn h3 { font-size: clamp(22px, 2.1vw, 32px); letter-spacing: -.03em; margin: 6px 0 8px; line-height: 1.05; }
.stn p { font-size: 15.5px; opacity: .88; }
@media (max-width: 800px) { .stations { grid-template-columns: 1fr 1fr; } }

/* 8. Shop */
.shelf { display: flex; gap: 14px; margin-top: clamp(28px, 5vh, 52px); }
.tile { flex: 1; min-width: 0; height: clamp(240px, 40vh, 380px); border-radius: 24px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; transition: flex .7s var(--ease), rotate .5s var(--ease); overflow: hidden; cursor: pointer; color: #fff; background: var(--blue); }
.tile:nth-child(5n + 2) { background: var(--soft); color: var(--fg); } .tile:nth-child(5n + 3) { background: var(--orange); } .tile:nth-child(5n + 4) { background: var(--fg); color: var(--bg); } .tile:nth-child(5n + 5) { background: var(--card); color: var(--fg); }
.tile:hover { flex: 2.4; rotate: -1.5deg; }
.tile h3 { font-size: clamp(19px, 2vw, 32px); letter-spacing: -.03em; line-height: 1.04; }
.badge { background: var(--orange); color: #fff; border-radius: 99px; padding: 3px 11px; margin-left: 10px; }
.shop-p { max-width: 44ch; opacity: .75; }
@media (max-width: 800px) { .shelf { flex-direction: column; } .tile { height: auto; min-height: 96px; flex: none !important; } }

/* 9. Action: the clapperboard */
.action .iris { --sbg: #101010; --sfg: #fff; min-height: 100svh; display: flex; align-items: center; }
.act { display: grid; grid-template-columns: minmax(280px, 460px) 1fr; gap: clamp(28px, 6vw, 100px); align-items: center; width: 100%; }
.clap { position: relative; width: 100%; padding-top: 58px; text-align: left; color: #fff; }
.arm { position: absolute; left: 0; top: 0; width: 100%; height: 50px; border-radius: 8px; background: repeating-linear-gradient(115deg, #fff 0 34px, #101010 34px 68px); border: 2px solid #fff; transform-origin: 4% 100%; rotate: -17deg; transition: rotate .5s var(--ease); }
.clap:hover .arm { rotate: -24deg; }
.clap.go .arm { animation: clap 1.5s var(--ease); }
@keyframes clap { 0% { rotate: -24deg; } 12% { rotate: 0deg; } 60% { rotate: 0deg; } 100% { rotate: -17deg; } }
.slate { border: 2px solid #fff; border-radius: 8px; background: #17171A; }
.slate .top { height: 34px; border-bottom: 2px solid #fff; background: repeating-linear-gradient(115deg, #fff 0 34px, #101010 34px 68px); }
.slate dl { display: grid; grid-template-columns: 1fr 1fr; margin: 0; }
.slate div { padding: 12px 14px; border-bottom: 1.5px solid rgba(255, 255, 255, .4); border-right: 1.5px solid rgba(255, 255, 255, .4); }
.slate div:nth-child(1) { grid-column: 1 / -1; border-right: 0; }
.slate div:nth-child(even) { border-right: 0; } .slate div:nth-last-child(-n + 2) { border-bottom: 0; }
.slate dt { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; opacity: .6; }
.slate dd { margin: 4px 0 0; font-family: var(--f-head); font-weight: 700; font-size: clamp(20px, 2.2vw, 30px); letter-spacing: -.02em; line-height: 1.05; }
.slate div:nth-child(1) dd { font-size: clamp(34px, 4.6vw, 64px); letter-spacing: -.04em; }
.act h2 { font-size: clamp(52px, 8vw, 132px); letter-spacing: -.055em; line-height: .9; }
.act h2 span { display: block; }
.act h2 span:nth-child(2) { color: var(--orange); } .act h2 span:nth-child(3) { color: #6F8BFF; }
.act p { max-width: 40ch; margin-top: 20px; font-size: clamp(17px, 1.4vw, 21px); color: rgba(255, 255, 255, .82); }
.links { display: grid; gap: 4px; justify-items: start; margin-top: 22px; font-family: var(--f-head); font-weight: 500; font-size: clamp(22px, 2.6vw, 40px); letter-spacing: -.03em; }
.links a { border-bottom: 2px solid transparent; transition: border-color .3s, color .3s; overflow-wrap: anywhere; }
.links a:hover { color: var(--orange); border-color: currentColor; }
@media (max-width: 900px) { .act { grid-template-columns: 1fr; } }

footer .wrap { display: flex; justify-content: space-between; align-items: center; gap: 24px; flex-wrap: wrap; padding-block: 24px; font-size: 13px; color: var(--muted); }
footer nav { display: flex; gap: 20px; }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 210; pointer-events: none; }
</style>
</head>
<body>

<header class="nav">
  <a class="logo" href="#top">The&nbsp;S<i></i>cial&nbsp;Company</a>
  <div data-controls></div>
</header>
<div class="hintcur" id="hint"></div>

<main id="top">
  <section class="scene hero"><div class="iris">
    <h1 class="sr" data-i18n="hero.title"></h1>
    <div class="hero-copy"><span class="label mono" data-i18n="hero.eyebrow"></span><p data-i18n="hero.sub"></p></div>
    <div class="hero-tools tools"><button class="tool" id="hReset"></button><button class="tool" id="hGrav"></button></div>
    <div id="stage"></div>
  </div></section>

  <section class="scene about"><div class="iris"><div class="wrap">
    <span class="label mono" data-i18n="about.title"></span>
    <p id="aboutText" data-i18n="about.body"></p>
    <ul class="inds" id="inds"></ul>
  </div></div></section>

  <section class="scene lights" id="lights"><div class="iris"><div class="cone" id="cone"></div><div class="wrap">
    <div class="head">
      <div><span class="label mono" id="l1"></span><h2 class="h" data-i18n="why.title"></h2></div>
      <div class="tools"><button class="tool" id="lSwitch"></button></div>
    </div>
    <div class="why" id="why"></div>
  </div></div></section>

  <section class="scene svc" id="services"><div class="iris"><div class="wrap">
    <div class="head">
      <div><span class="label mono" data-i18n="services.label"></span><h2 class="h" data-i18n="services.title"></h2></div>
    </div>
    <div class="ringbox" id="ringbox" data-cur="spin"><div class="ring" id="ring"></div></div>
    <div class="ring-ui"><button id="rPrev" aria-label="previous">←</button><span class="mono" id="rNow"></span><button id="rNext" aria-label="next">→</button></div>
    <div class="addons" id="addons"></div>
  </div></div></section>

  <section class="scene cam" id="clients"><div class="iris"><div class="wrap">
    <div class="head">
      <div><span class="label mono" id="l2"></span><h2 class="h" data-i18n="clients.title"></h2></div>
      <div class="tools"><button class="tool" id="bShuffle"></button><button class="tool" id="bTidy"></button></div>
    </div>
    <div class="board" id="board"></div>
  </div></div></section>

  <section class="scene" id="packages"><div class="iris"><div class="wrap">
    <span class="label mono" data-i18n="packages.label"></span>
    <h2 class="h" data-i18n="packages.title"></h2>
    <div class="pk3" id="pk3"></div>
    <p class="note" data-i18n="packages.note"></p>
  </div></div></section>

  <section class="scene proc" id="proc"><div class="iris"><div class="wrap">
    <span class="label mono" data-i18n="process.label"></span>
    <h2 class="h" data-i18n="process.title"></h2>
    <div class="track">
      <svg viewBox="0 0 1000 170" aria-hidden="true"><path class="bg" d="M10,130 C150,10 250,10 330,95 S520,175 660,80 S880,5 990,95"/><path class="fg" id="pFg" d="M10,130 C150,10 250,10 330,95 S520,175 660,80 S880,5 990,95"/><circle id="pDot" r="11"/></svg>
      <div class="stations" id="stations"></div>
    </div>
  </div></div></section>

  <section class="scene" id="shop"><div class="iris"><div class="wrap">
    <div class="head">
      <div><span class="label mono"><span data-i18n="shop.label"></span><span class="badge" data-i18n="shop.badge"></span></span><h2 class="h" data-i18n="shop.title"></h2></div>
      <p class="shop-p" data-i18n="shop.body"></p>
    </div>
    <div class="shelf" id="shelf"></div>
  </div></div></section>

  <section class="scene action" id="contact"><div class="iris"><div class="wrap"><div class="act">
    <button class="clap" id="clap" data-cur="clap" type="button">
      <span class="arm"></span>
      <span class="slate"><span class="top" style="display:block"></span><dl id="slate"></dl></span>
    </button>
    <div>
      <h2 id="lca"></h2>
      <p><span data-i18n="contact.body"></span> <b style="color:#fff" data-i18n="contact.free"></b></p>
      <div class="links"><a data-email></a><a data-ig></a></div>
    </div>
  </div></div></div></section>
</main>

<footer><div class="wrap">
  <span data-i18n="footer.rights"></span>
  <span data-banners></span>
  <nav><a href="../index.html" data-i18n="ui.back"></a><a href="#top" data-i18n="footer.top"></a></nav>

    try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); const n = ac.createBufferSource(), buf = ac.createBuffer(1, 2200, ac.sampleRate), d = buf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3); n.buffer = buf; const g = ac.createGain(); g.gain.value = .5; n.connect(g).connect(ac.destination); n.start(ac.currentTime + .17); } catch (e) {}
  });
})();

/* ---------- Scroll: iris openings, about words, the process line ---------- */
const scenes = $$('.scene').slice(1).map(s => ({ s, iris: $('.iris', s) })), pFg = $('#pFg'), pDot = $('#pDot'), pLen = pFg.getTotalLength(), stns = $$('.stn'), procEl = $('#proc'), aboutEl = $('#aboutText');
pFg.style.strokeDasharray = pLen;
function onScroll() {
  const vh = innerHeight;
  for (const sc of scenes) { const top = sc.s.getBoundingClientRect().top; if (TSC.reduced) { sc.iris.style.setProperty('--r', '200vmax'); continue; } const p = clamp((vh - top) / (vh * .75), 0, 1); sc.iris.style.setProperty('--r', p >= 1 ? '200vmax' : (p * p * 130 + 4) + 'vmax'); }
  const ar = aboutEl.getBoundingClientRect(), ap = clamp((vh * .85 - ar.top) / (ar.height + vh * .3), 0, 1), n = aboutWords.length;
  aboutWords.forEach((w, i) => { w.style.opacity = TSC.reduced ? 1 : .16 + .84 * clamp((ap * (n + 4) - i) / 4, 0, 1); });
  const tr = $('.track', procEl).getBoundingClientRect(), pp = TSC.reduced ? 1 : clamp((vh * .78 - tr.top) / (vh * .55), 0, 1), pt = pFg.getPointAtLength(pp * pLen);
  pFg.style.strokeDashoffset = pLen * (1 - pp); pDot.setAttribute('cx', pt.x); pDot.setAttribute('cy', pt.y);
  stns.forEach((s, i) => s.classList.toggle('on', pp >= i / 4 + .06));
}
addEventListener('scroll', onScroll, { passive: true }); addEventListener('resize', onScroll); onScroll();
